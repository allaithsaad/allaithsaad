<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Allaith Al-Aqraa — Full-Stack Mobile and Web Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0E75B6"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0E75B6"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-1 0; 1 0; -1 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0E75B6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0E75B6" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-1 0; 1 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0 L0 0 0 34" fill="none" stroke="#1e3a5f" stroke-width="0.6"/>
    </pattern>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="card">
      <rect x="0" y="0" width="900" height="260" rx="18"/>
    </clipPath>

    <style>
      .float-a { animation: fa 9s ease-in-out infinite; }
      .float-b { animation: fb 12s ease-in-out infinite; }
      .float-c { animation: fc 7s ease-in-out infinite; }
      @keyframes fa {
        0%,100% { transform: translate(0,0); opacity:.30 }
        50%     { transform: translate(22px,-16px); opacity:.55 }
      }
      @keyframes fb {
        0%,100% { transform: translate(0,0); opacity:.22 }
        50%     { transform: translate(-26px,14px); opacity:.42 }
      }
      @keyframes fc {
        0%,100% { transform: translate(0,0); opacity:.35 }
        50%     { transform: translate(12px,18px); opacity:.14 }
      }
      .caret { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }

      .rise { animation: rise 1s cubic-bezier(.2,.7,.3,1) both; }
      .rise-2 { animation: rise 1s .18s cubic-bezier(.2,.7,.3,1) both; }
      .rise-3 { animation: rise 1s .34s cubic-bezier(.2,.7,.3,1) both; }
      @keyframes rise {
        from { opacity:0; transform: translateY(14px) }
        to   { opacity:1; transform: translateY(0) }
      }

      .pulse { animation: pulse 3.2s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity:.45 } 50% { opacity:1 } }

      .sweep { animation: sweep 5.5s ease-in-out infinite; }
      @keyframes sweep {
        0%   { transform: translateX(-340px); opacity:0 }
        18%  { opacity:.55 }
        55%  { opacity:.55 }
        100% { transform: translateX(560px); opacity:0 }
      }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="900" height="260" fill="url(#bg)"/>
    <rect width="900" height="260" fill="url(#grid)" opacity="0.5"/>

    <!-- ambient orbs -->
    <circle class="float-a" cx="792" cy="66"  r="76" fill="#0E75B6" filter="url(#glow)"/>
    <circle class="float-b" cx="118" cy="212" r="58" fill="#38BDF8" filter="url(#glow)"/>
    <circle class="float-c" cx="690" cy="214" r="34" fill="#7C3AED" filter="url(#glow)"/>

    <!-- name -->
    <text class="rise" x="56" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif"
      font-size="52" font-weight="700" fill="#F3F6FC" letter-spacing="0.5">Allaith Al-Aqraa</text>

    <!-- shimmer across the name -->
    <g clip-path="url(#card)">
      <rect class="sweep" x="40" y="70" width="150" height="60" fill="url(#edge)"/>
    </g>

    <!-- animated underline -->
    <rect class="rise-2" x="58" y="128" width="242" height="4" rx="2" fill="url(#accent)"/>

    <!-- role -->
    <text class="rise-2" x="58" y="170" font-family="Consolas, Menlo, monospace"
      font-size="19" fill="#7FD1F5">Full-Stack Mobile &amp; Web Engineer</text>

    <!-- terminal-style line with blinking caret -->
    <text class="rise-3" x="58" y="206" font-family="Consolas, Menlo, monospace"
      font-size="15.5" fill="#8FA3BF">
      <tspan fill="#4ADE80">~$</tspan>
      <tspan dx="8">flutter · next.js · typescript · cloud</tspan>
    </text>
    <rect class="caret" x="404" y="193" width="9" height="17" fill="#38BDF8"/>

    <!-- status dot -->
    <g class="rise-3">
      <circle class="pulse" cx="66" cy="232" r="4.5" fill="#4ADE80"/>
      <text x="80" y="236" font-family="Consolas, Menlo, monospace" font-size="13" fill="#5C7290">Riyadh, Saudi Arabia</text>
    </g>

    <!-- animated top edge -->
    <rect x="0" y="0" width="900" height="2.5" fill="url(#edge)"/>
    <rect x="0" y="0" width="900" height="260" rx="18" fill="none" stroke="#1e3a5f" stroke-width="1.4"/>
  </g>
</svg>
